<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETA v0.3</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7fa;color:#1b2836;margin:0}main{max-width:700px;margin:auto;padding:16px}section{background:white;border-radius:14px;padding:18px;margin:14px 0}canvas{width:100%;height:auto;border:1px solid #bbc6d0;touch-action:manipulation}button{padding:12px;border:0;border-radius:9px;background:#1666a1;color:white;font-size:16px;margin:5px}button:disabled{opacity:.45}input{max-width:100%}td{padding:8px;border-bottom:1px solid #ddd}small{color:#526170}</style></head><body><main><h2>Endoscopic Tracing Analyzer</h2><small>研究用プロトタイプ v0.3：測定精度未検証</small><section><h3>1. 写真を選択</h3><input id="file" type="file" accept="image/*"><p id="status">画像を選んでください。</p><img id="preview" style="display:none;max-width:100%" alt="選択画像"></section><section><h3>2. 位置合わせ</h3><p>画像の黒い四角の中心を「左上→右上→右下→左下」の順にタップしてください。</p><canvas id="view" width="600" height="600"></canvas><p><button id="reset">点をリセット</button><button id="run" disabled>解析</button></p></section><section id="results" hidden><h3>3. 暫定結果</h3><table id="table"></table><canvas id="overlay" width="500" height="500"></canvas><p><button id="csv">CSV保存</button><button id="png">解析画像保存</button></p></section><section><small>注意：水色ターゲット半径20 mm、線幅2 mm、マーカー中心間100 mmを想定。許容帯内判定は中心線から±0.75 mm。画像内の暗色画素を暫定的にインクと判定します。写真の影や印刷条件による誤差があります。数値は論文用の検証済み指標ではありません。画像は外部送信しません。</small></section></main><script>
const el=id=>document.getElementById(id),view=el('view'),ctx=view.getContext('2d'),overlay=el('overlay'),oc=overlay.getContext('2d');let img=null,pts=[],scale=1,dx=0,dy=0,results=null;
function show(){if(!img)return;let w=img.naturalWidth,h=img.naturalHeight;scale=Math.min(600/w,600/h);dx=(600-w*scale)/2;dy=(600-h*scale)/2;ctx.fillStyle='white';ctx.fillRect(0,0,600,600);ctx.drawImage(img,dx,dy,w*scale,h*scale);pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x*scale+dx,p.y*scale+dy,7,0,7);ctx.fillStyle='#d12648';ctx.fill();ctx.fillStyle='white';ctx.font='bold 12px sans-serif';ctx.fillText(i+1,p.x*scale+dx-3,p.y*scale+dy+4)});el('status').textContent='画像表示OK。位置合わせ '+pts.length+'/4 点';}
el('file').onchange=()=>{let f=el('file').files[0];if(!f)return;el('status').textContent='読み込み中…';let reader=new FileReader();reader.onerror=()=>el('status').textContent='読み込みエラー';reader.onload=()=>{let next=new Image();next.onload=()=>{img=next;pts=[];el('preview').src=reader.result;el('preview').style.display='block';el('results').hidden=true;el('run').disabled=true;show()};next.onerror=()=>el('status').textContent='画像を開けません。JPEGかPNGで試してください。';next.src=reader.result};reader.readAsDataURL(f)};
view.onclick=e=>{if(!img||pts.length===4)return;let r=view.getBoundingClientRect();let x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;pts.push({x:(x-dx)/scale,y:(y-dy)/scale});show();el('run').disabled=pts.length!==4};
el('reset').onclick=()=>{pts=[];el('run').disabled=true;el('results').hidden=true;show()};
function solve(A,b){let n=b.length;A=A.map((r,i)=>[...r,b[i]]);for(let j=0;j<n;j++){let k=j;for(let i=j+1;i<n;i++)if(Math.abs(A[i][j])>Math.abs(A[k][j]))k=i;[A[j],A[k]]=[A[k],A[j]];let z=A[j][j];if(Math.abs(z)<1e-9)throw Error('位置合わせ点を確認してください');for(let q=j;q<=n;q++)A[j][q]/=z;for(let i=0;i<n;i++)if(i!==j){z=A[i][j];for(let q=j;q<=n;q++)A[i][q]-=z*A[j][q]}}return A.map(r=>r[n])}
function transform(){let target=[[0,0],[100,0],[100,100],[0,100]],A=[],b=[];target.forEach(([x,y],i)=>{let p=pts[i];A.push([x,y,1,0,0,0,-p.x*x,-p.x*y]);b.push(p.x);A.push([0,0,0,x,y,1,-p.y*x,-p.y*y]);b.push(p.y)});return solve(A,b)}
function map(H,x,y){let d=H[6]*x+H[7]*y+1;return [(H[0]*x+H[1]*y+H[2])/d,(H[3]*x+H[4]*y+H[5])/d]}
el('run').onclick=()=>{try{let H=transform(),src=document.createElement('canvas');src.width=img.naturalWidth;src.height=img.naturalHeight;let sc=src.getContext('2d');sc.drawImage(img,0,0);let data=sc.getImageData(0,0,src.width,src.height).data;let out=oc.createImageData(500,500),total=0,good=0,sum=0,max=0,sectors=new Uint8Array(720);for(let py=0;py<500;py++)for(let px=0;px<500;px++){let x=px/5,y=py/5,[u,v]=map(H,x,y),i=(py*500+px)*4,R=255,G=255,B=255;if(u>=0&&v>=0&&u<src.width&&v<src.height){let j=(Math.round(v)*src.width+Math.round(u))*4;R=data[j];G=data[j+1];B=data[j+2]}let radius=Math.hypot(x-50,y-50),err=Math.abs(radius-20),cyan=B>R+18&&G>R+12&&B>110,gray=Math.max(R,G,B)-Math.min(R,G,B)<38&&(R+G+B)/3<160,ink=gray&&radius>16&&radius<25;let color=ink?(err<=.75?[30,160,75]:[220,55,55]):cyan?[120,218,235]:[R,G,B];out.data.set([...color,255],i);if(ink){total++;sum+=err;max=Math.max(max,err);if(err<=.75){good++;let a=Math.atan2(y-50,x-50);sectors[Math.floor((a+Math.PI)/(2*Math.PI)*720)%720]=1}}}oc.putImageData(out,0,0);results={coverage:(sectors.reduce((a,b)=>a+b,0)/720*100).toFixed(1),inBand:(total?good/total*100:0).toFixed(1),MARE:(total?sum/total:0).toFixed(3),max:max.toFixed(3),pixels:total};el('table').innerHTML=[['円周カバー率（暫定）',results.coverage+' %'],['許容帯内の暗色画素率',results.inBand+' %'],['平均半径誤差（画素基準）',results.MARE+' mm'],['最大半径誤差（画素基準）',results.max+' mm'],['検出画素数',total]].map(([a,b])=>'<tr><td>'+a+'</td><td>'+b+'</td></tr>').join('');el('results').hidden=false;el('results').scrollIntoView({behavior:'smooth'})}catch(e){alert('解析エラー：'+e.message)}};
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}el('csv').onclick=()=>{if(!results)return;download(new Blob(['metric,value\n'+Object.entries(results).map(([k,v])=>k+','+v).join('\n')],{type:'text/csv'}),'ETA_results.csv')};el('png').onclick=()=>overlay.toBlob(b=>download(b,'ETA_overlay.png'));
</script></body></html>
